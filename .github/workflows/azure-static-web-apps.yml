name: Azure Static Web Apps CI/CD

# Production deploy of the frontend (push to main or by hand).
# Pull requests only check that the frontend builds: they no longer create a
# preview environment in swa-ledens. Previews were never used for review and
# they filled the plan's limit of 10 staging environments, which made every PR
# fail («maximum number of staging environments»). Closing a PR and the weekly
# cleanup live in swa-cerrar-pr.yml and swa-limpiar-entornos.yml.

on:
  push:
    branches: [main]
    paths:
      - 'ledens/frontend/**'
      - '.github/workflows/azure-static-web-apps.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - 'ledens/frontend/**'
      - '.github/workflows/azure-static-web-apps.yml'
  workflow_dispatch:       # allow manual production deploy from GitHub UI

permissions:
  contents: read

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Build and Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "ledens/frontend"
          output_location: "dist"
          api_location: ""

  build_pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: Build (sin vista previa)
    defaults:
      run:
        working-directory: ledens/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ledens/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
